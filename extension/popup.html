<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 12px;
      background: #14161A;
      color: #F4F6F9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }
    h3 {
      margin: 0 0 10px 0;
      font-size: 14px;
      font-weight: 600;
      color: #7CB4D8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stream-item {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 8px;
      margin-bottom: 8px;
    }
    .stream-type {
      font-weight: 600;
      color: #7CB4D8;
      font-size: 11px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .stream-url {
      word-break: break-all;
      font-family: monospace;
      font-size: 11px;
      color: #A0A5AD;
      max-height: 40px;
      overflow: hidden;
      margin-bottom: 6px;
    }
    button {
      background: #7CB4D8;
      color: #14161A;
      border: none;
      padding: 5px 12px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background: #90C3E3;
    }
    .empty {
      color: #6C727C;
      text-align: center;
      padding: 20px 0;
    }
  </style>
</head>
<body>
  <h3>Kestrel Stream Sniffer</h3>
  <div id="list"></div>
  <script src="popup.js"></script>
</body>
</html>
