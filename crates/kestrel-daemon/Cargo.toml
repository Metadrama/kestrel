[package]
name = "kestrel-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "kestrel-daemon"
path = "src/main.rs"

[dependencies]
kestrel-proto = { path = "../kestrel-proto" }
kestrel-store = { path = "../kestrel-store" }
kestrel-core = { path = "../kestrel-core" }
kestrel-ipc = { path = "../kestrel-ipc" }
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
directories = "6.0"
ulid = "1.2"
